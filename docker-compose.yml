services:

  db:
    image: postgres:16-alpine
    container_name: weightbox-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: weightbox-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  etl:
    build:
      context: ./etl

    container_name: weightbox-etl

    env_file:
      - .env

    volumes:
      - ./data:/app/data

    depends_on:
      db:
        condition: service_healthy

    profiles:
      - etl


volumes:

  postgres_data: